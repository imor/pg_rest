[package]
name = "pg_rest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg13"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13" ]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14" ]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.19.2"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync"] }
reqwest = { version = "0.13.5" }
hyper = "1.11.1"
tower = { version = "0.5.3", default-features = false, features = ["limit"] }
serde_json = "1.0.151"
url = "2.5.8"
libc = "0.2.189"

[dependencies.pgrx-bench]
version = "=0.19.2"
optional = true

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
